name: Test lead webhook

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/test-lead-webhook.yml'

permissions:
  contents: read

jobs:
  test-webhook:
    runs-on: ubuntu-latest
    steps:
      - name: Send synthetic lead
        env:
          WEBHOOK_URL: https://script.google.com/macros/s/AKfycbxQqkmt93WTgvuYQIEe3QPdzYxuk-eFj5GHfZ_XAYnugRJoafWBsCJge5QIv6Np8_wQ/exec
        run: |
          set -euo pipefail
          payload='{"leadId":"nove-webhook-test-20260909","capturedAt":"2026-09-09T05:14:17Z","updatedAt":"2026-09-09T05:14:17Z","name":"Teste Automático NOVE","phone":"(91) 90000-0000","consent":true,"state":"Pará","terrain":"","area":"","investment":"","objective":"","timing":"","city":"","score":"","status":"captured","lastStage":"Teste webhook","whatsappClicked":false,"origin":"Teste técnico NOVE"}'
          response=$(curl --fail --silent --show-error --location --retry 2 \
            --header 'Content-Type: text/plain;charset=utf-8' \
            --data-raw "$payload" \
            "$WEBHOOK_URL")
          echo "$response"
          echo "$response" | grep -q '"ok":true'
