name: Deploy to GitHub Pages

on:
  push:
    branches: [pages-publish]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch VSL binary and remove legacy chunk artifacts
        shell: bash
        env:
          VSL_URL: https://res.cloudinary.com/pc0xifey/video/upload/v1788892095/SaveClip.App_AQPwmXAGJSxoUh0L2-vJOaTkCaCs8ErHNMx1oUCRPIq5iiYsW1cCqAwKz4TjmQLbz1W0atxyV3VvfSRJURYWarHa.mp4
          VSL_BYTES: "12185477"
        run: |
          set -euo pipefail
          mkdir -p assets

          if [ ! -s assets/vsl.mp4 ]; then
            curl --fail --location --retry 2 --retry-delay 2 "$VSL_URL" --output assets/vsl.mp4
          fi

          actual_bytes="$(wc -c < assets/vsl.mp4 | tr -d ' ')"
          test "$actual_bytes" = "$VSL_BYTES"
          file assets/vsl.mp4 | grep -qi 'MP4'

          rm -rf \
            deploy_chunks \
            pages_chunks \
            pages_media10 \
            pages_media20 \
            tiny_chunks \
            vsl_parts \
            vsl120_parts

          echo "VSL ready: ${actual_bytes} bytes"

      - name: Persist VSL binary and cleanup to pages-publish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Repository already contains the VSL binary and no legacy chunks."
          else
            git commit -m "chore: store VSL binary and remove chunk workarounds [skip ci]"
            git push origin HEAD:pages-publish
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
