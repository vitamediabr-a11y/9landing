name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild VSL
        shell: bash
        run: |
          mkdir -p assets
          cat vsl120_parts/part-* | tr -d '\n' | base64 --decode > assets/vsl.mp4
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/vsl.mp4')
          data = p.read_bytes()
          assert len(data) > 10000, 'VSL file too small'
          assert b'ftyp' in data[:32], 'Invalid MP4 header'
          print(f'VSL rebuilt: {len(data)} bytes')
          PY
          rm -rf vsl120_parts vsl_parts tiny_chunks pages_media10 pages_media20 deploy_chunks

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
