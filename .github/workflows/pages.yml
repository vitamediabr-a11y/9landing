name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild VSL
        shell: bash
        run: |
          mkdir -p assets
          python - <<'PY'
          from pathlib import Path
          import base64, glob, re

          output = bytearray()
          parts = sorted(glob.glob('vsl120_parts/part-*'))
          assert parts, 'No VSL chunks found'

          for name in parts:
              text = Path(name).read_text(errors='ignore')
              clean = re.sub(r'[^A-Za-z0-9+/=]', '', text)
              clean += '=' * ((4 - len(clean) % 4) % 4)
              output.extend(base64.b64decode(clean, validate=False))

          assert len(output) > 10000, 'VSL file too small'
          assert b'ftyp' in output[:32], 'Invalid MP4 header'
          Path('assets/vsl.mp4').write_bytes(output)
          print(f'VSL rebuilt: {len(output)} bytes from {len(parts)} chunks')
          PY
          rm -rf vsl120_parts vsl_parts tiny_chunks pages_media10 pages_media20 deploy_chunks

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
