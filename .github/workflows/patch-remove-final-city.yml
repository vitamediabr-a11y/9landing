name: Patch final city step

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-remove-final-city.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate city step
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('assets/script.js')
          s = p.read_text()
          replacements = [
              ("      else showLeadForm();", "      else { state.step = QUESTIONS.length; saveState(); showResult(); }"),
              ("Cidade/UF: ${l.city} / ${a.state}\\n", "Estado: ${a.state}\\n"),
              ("    trackEvent(`lead_${state.score}`, { region:state.answers.state });", "    trackEvent(`lead_${state.score}`, { region:state.answers.state });\n    if (window.NoveLeadSync?.sync) void window.NoveLeadSync.sync('completed', { lastStage:'Quiz concluído' });"),
              ("    else if (state.step >= QUESTIONS.length) showLeadForm();", "    else if (state.step >= QUESTIONS.length) showResult();"),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match for {old!r}, found {count}')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          node --check assets/script.js
          git diff --check
          git diff -- assets/script.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/script.js
          git commit -m "fix: remove duplicate final city step"
          git push
